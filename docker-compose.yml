services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/apird:latest
    container_name: api
    env_file:
      - /home/useradmin/api/mainapi/.env
    environment:
      # Baked into the image (see Dockerfile). Kept outside /home/useradmin/api
      # because that path is bind-mounted from the host below and would shadow
      # the image's copy.
      - PRIVATE_DIR=/app/private
      - CONTENT_PATH=/home/useradmin/api/mainapi/src/src/content
      - SEASONS_PATH=/usr/share/nginx/html/raindrippy/content
      - GAMES_DIR=/home/useradmin/api/mainapi/src/src/games
      # Secrets injected at deploy time from GitHub Actions (see .github/workflows/deploy.yml).
      # These override any values in the env_file above.
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Console commands go over RCON directly (network_mode: host reaches the
      # published port below), so the API needs no Docker access for them.
      #
      # This MUST equal `rcon.password` in /home/useradmin/mcserver/server.properties.
      # That file is authoritative: the minecraft service below overrides itzg's
      # entrypoint with /data/start.sh, which bypasses the image's normal
      # env-var -> server.properties handling, so setting RCON_PASSWORD there
      # does not necessarily change what the server actually accepts.
      #
      # Supplied by the deploy workflow's .env (secrets.RCON_PASSWORD). If it is
      # blank, compose warns and the console's command box reports
      # "RCON is not configured on this server".
      - RCON_PASSWORD=${RCON_PASSWORD}
    ports:
      - "5000:5000"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      # NOTE: /var/run/docker.sock is deliberately NOT mounted here. Docker
      # socket access is root-equivalent on the host (an attacker can POST
      # /containers/create with a "/:/host" bind), so lifecycle control is
      # delegated to the mc-control sidecar below, which only ever runs three
      # fixed commands.
      - mc-control:/control
      - /home/useradmin/mcserver:/mcserver
      - /home/useradmin/mcserver:/home/useradmin/mcserver
      - /home/useradmin/api/mainapi/data:/home/useradmin/api/mainapi/data
      - /home/useradmin/api:/home/useradmin/api
      - /usr/share/nginx/html/raindrippy/content:/usr/share/nginx/html/raindrippy/content:ro
      - /usr/share/nginx/html/raindrippy/projects/public:/usr/share/nginx/html/raindrippy/projects/public:rw
    network_mode: "host"

  # Holds the Docker socket so the API does not have to.
  #
  # It reads command files the API drops into /control/queue and matches them
  # against a three-verb allowlist. Anything else is logged and discarded, so
  # the worst an attacker who fully controls the API container can do through
  # this channel is start, stop or restart the Minecraft container — not create
  # a privileged container and own the host.
  #
  # The command name is never interpolated into the docker invocation; the case
  # branch selects a hardcoded command, so no input reaches the shell as code.
  mc-control:
    image: docker:cli
    container_name: mc-control
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mc-control:/control
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        TARGET=minecraft
        mkdir -p /control/queue

        # Publish container state for the API, which cannot ask the daemon.
        while :; do
          if docker inspect -f '{{.State.Running}}' "$$TARGET" > /control/status.tmp 2>/dev/null; then
            mv /control/status.tmp /control/status
          else
            echo unknown > /control/status.tmp && mv /control/status.tmp /control/status
          fi
          sleep 5
        done &

        echo "mc-control: watching /control/queue for $$TARGET"
        while :; do
          for f in /control/queue/*.cmd; do
            [ -e "$$f" ] || continue
            cmd=$$(cat "$$f" 2>/dev/null || echo "")
            rm -f "$$f"
            case "$$cmd" in
              start)   echo "mc-control: start";   docker start "$$TARGET"   || true ;;
              stop)    echo "mc-control: stop";    docker stop "$$TARGET"    || true ;;
              restart) echo "mc-control: restart"; docker restart "$$TARGET" || true ;;
              *)       echo "mc-control: rejected unknown command" ;;
            esac
          done
          sleep 1
        done

  minecraft:
    image: itzg/minecraft-server:java21-jdk
    container_name: minecraft
    ports:
      - "29704:29704"
      - "29705:29705"
      - "29706:29706"
      - "29707:29707"
      - "29708:29708"
      - "29709:29709"
      - "29710:29710"
      - "29875:29875"
    environment:
      EULA: "TRUE"
      MEMORY: "4G"
      JVM_OPTS: >
        -Xms4G -Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=20
        -XX:G1ReservePercent=20 -XX:G1HeapRegionSize=16M
        -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCCountTarget=4
        -XX:SurvivorRatio=32
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: 29875
    volumes:
      - /home/useradmin/mcserver:/data
    working_dir: /data
    entrypoint: ["/bin/bash", "/data/start.sh"]
    stdin_open: true
    tty: true
    restart: unless-stopped

# Shared spool between the API and the mc-control sidecar: the API writes
# command files into /control/queue, the sidecar writes /control/status back.
volumes:
  mc-control:
