services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/apird:latest
    container_name: api
    env_file:
      - /home/useradmin/api/mainapi/.env
    environment:
      # Baked into the image (see Dockerfile). Kept outside /home/useradmin/api
      # because that path is bind-mounted from the host below and would shadow
      # the image's copy.
      - PRIVATE_DIR=/app/private
      - CONTENT_PATH=/home/useradmin/api/mainapi/src/src/content
      - SEASONS_PATH=/usr/share/nginx/html/raindrippy/content
      - GAMES_DIR=/home/useradmin/api/mainapi/src/src/games
      # Secrets injected at deploy time from GitHub Actions (see .github/workflows/deploy.yml).
      # These override any values in the env_file above.
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Console commands go over RCON directly (network_mode: host reaches the
      # published port below), so the API needs no Docker access for them.
      #
      # This MUST equal `rcon.password` in /home/useradmin/mcserver/server.properties.
      # That file is authoritative, and stays that way: the minecraft service
      # below sets SKIP_SERVER_PROPERTIES, so the image never rewrites it from
      # environment variables. Setting an RCON password on that service would
      # therefore change nothing about what the server accepts, which is why it
      # no longer carries one.
      #
      # (Until recently the reason was different -- that service overrode the
      # image's entrypoint entirely -- but the conclusion was the same.)
      #
      # Supplied by the deploy workflow's .env (secrets.RCON_PASSWORD). If it is
      # blank, compose warns and the console's command box reports
      # "RCON is not configured on this server".
      - RCON_PASSWORD=${RCON_PASSWORD}
    ports:
      - "5000:5000"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      # NOTE: /var/run/docker.sock is deliberately NOT mounted here. Docker
      # socket access is root-equivalent on the host (an attacker can POST
      # /containers/create with a "/:/host" bind), so lifecycle control is
      # delegated to the mc-control sidecar below, which only ever runs three
      # fixed commands.
      - mc-control:/control
      - /home/useradmin/mcserver:/mcserver
      - /home/useradmin/mcserver:/home/useradmin/mcserver
      - /home/useradmin/api/mainapi/data:/home/useradmin/api/mainapi/data
      - /home/useradmin/api:/home/useradmin/api
      - /usr/share/nginx/html/raindrippy/content:/usr/share/nginx/html/raindrippy/content:ro
      - /usr/share/nginx/html/raindrippy/projects/public:/usr/share/nginx/html/raindrippy/projects/public:rw
    network_mode: "host"

  # Renders inventory icons whenever the modpack changes.
  #
  # A sidecar rather than a job the API triggers, because triggering it would
  # mean giving the API a way to start containers -- exactly the Docker socket
  # access the mc-control split below exists to avoid. This watches the mods
  # directory itself and writes finished PNGs into the same texture cache the
  # API serves from, so the two never have to talk: the API checks that cache
  # before doing anything else, and a file appearing there is enough.
  #
  # Read-only on the mods directory. It only ever reads jars and writes icons.
  item-icons:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/apird-item-icons:latest
    container_name: item-icons
    restart: unless-stopped
    command: ["watch"]
    environment:
      # Must match the API's MINECRAFT_ASSETS_VERSION: the version is part of
      # the cache path, so a mismatch files the icons where nothing looks.
      - MC_VERSION=1.21.1
      - POLL_INTERVAL=300
    volumes:
      - /home/useradmin/mcserver/mods:/mods:ro
      - /home/useradmin/api/mainapi/data/item-textures:/cache
      # The extracted client assets, kept so a restart does not re-download
      # them.
      - item-icons-work:/work

  # Holds the Docker socket so the API does not have to.
  #
  # It reads command files the API drops into /control/queue and matches them
  # against a three-verb allowlist. Anything else is logged and discarded, so
  # the worst an attacker who fully controls the API container can do through
  # this channel is start, stop or restart the Minecraft container — not create
  # a privileged container and own the host.
  #
  # The command name is never interpolated into the docker invocation; the case
  # branch selects a hardcoded command, so no input reaches the shell as code.
  mc-control:
    image: docker:cli
    container_name: mc-control
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mc-control:/control
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        TARGET=minecraft
        mkdir -p /control/queue

        # Host CPU count, published alongside the stats so the API can turn
        # docker's core-summed percentage into a figure a human can judge:
        # 143.7% of one core is 36% of four, and only the second reads as
        # "fine". Read once — a host does not grow cores while running.
        CORES=$$(docker info --format '{{.NCPU}}' 2>/dev/null || echo 0)
        echo "mc-control: host reports $$CORES CPUs"

        # Publish container state and resource usage for the API, which cannot
        # ask the daemon itself. Both are written to a .tmp first and renamed,
        # so the API never reads a half-written file.
        while :; do
          if docker inspect -f '{{.State.Running}}' "$$TARGET" > /control/status.tmp 2>/dev/null; then
            mv /control/status.tmp /control/status
          else
            echo unknown > /control/status.tmp && mv /control/status.tmp /control/status
          fi

          # CPU and memory for the console's performance panel. On failure the
          # file is removed rather than left behind, so the panel shows
          # "unavailable" instead of whatever the last reading happened to be.
          # (The API also ignores a stats file older than 30s, which covers
          # this sidecar dying outright.)
          if docker stats --no-stream --format "{{.CPUPerc}}|{{.MemUsage}}|{{.MemPerc}}|$$CORES" "$$TARGET" > /control/stats.tmp 2>/dev/null; then
            mv /control/stats.tmp /control/stats
          else
            rm -f /control/stats.tmp /control/stats
          fi

          sleep 5
        done &

        echo "mc-control: watching /control/queue for $$TARGET"
        while :; do
          for f in /control/queue/*.cmd; do
            [ -e "$$f" ] || continue
            cmd=$$(cat "$$f" 2>/dev/null || echo "")
            rm -f "$$f"
            case "$$cmd" in
              # -t is explicit rather than inherited. `docker stop` falls back
              # to ten seconds unless the container was created with a longer
              # StopTimeout, and ten seconds is not remotely enough for a modded
              # server to save and shut down: it gets SIGKILLed mid-shutdown,
              # and every player is rolled back to the last autosave while the
              # world -- whose chunks are written continuously -- looks fine.
              # The API also forces a save before queueing either of these, so
              # this is the second of two defences rather than the only one.
              start)   echo "mc-control: start";   docker start "$$TARGET"          || true ;;
              stop)    echo "mc-control: stop";    docker stop -t 180 "$$TARGET"    || true ;;
              restart) echo "mc-control: restart"; docker restart -t 180 "$$TARGET" || true ;;
              *)       echo "mc-control: rejected unknown command" ;;
            esac
          done
          sleep 1
        done

  minecraft:
    image: itzg/minecraft-server:java21-jdk
    container_name: minecraft
    ports:
      - "29704:29704"
      - "29705:29705"
      - "29706:29706"
      - "29707:29707"
      - "29708:29708"
      - "29709:29709"
      - "29710:29710"
      - "29875:29875"
    # The image's own entrypoint runs mc-server-runner, which holds the server's
    # stdin, traps SIGTERM and sends it the `stop` command -- the server's real
    # shutdown path, rather than a JVM shutdown hook racing the process exit.
    #
    # This used to be overridden with `entrypoint: [/bin/bash, /data/start.sh]`,
    # and that override is what cost players their inventories on every restart:
    # the script ran `java` without `exec`, so PID 1 was bash, bash neither
    # forwards SIGTERM nor acts on it while a foreground child is running, and
    # the JVM was never told to stop. Docker killed it outright at the end of
    # the grace period (exit 137) and every online player rolled back to the
    # last autosave.
    #
    # Everything start.sh used to do is expressed below instead. To go back,
    # restore the entrypoint line -- nothing else here depends on the change.
    environment:
      EULA: "TRUE"

      # The jar start.sh ran. TYPE=CUSTOM means the image uses this file as-is
      # and downloads nothing.
      TYPE: "CUSTOM"
      CUSTOM_SERVER: "/data/software.jar"

      # Leave server.properties exactly as it is on disk.
      #
      # This is the setting that keeps the switch behaviour-neutral. The image
      # normally writes server.properties from environment variables, and the
      # ones it defaults are not harmless here: SERVER_PORT alone would move
      # the server from 29704 to 25565. Because the entrypoint has been
      # overridden since day one, that step has never run -- the file on disk is
      # the only source of truth, and it stays that way.
      #
      # RCON is configured in that same file (the panel talks to it on 29875),
      # so there are deliberately no ENABLE_RCON / RCON_PASSWORD / RCON_PORT
      # variables here. They would do nothing while this is set, and a variable
      # that does nothing is worse than no variable.
      SKIP_SERVER_PROPERTIES: "true"

      # -Xms4G -Xmx4G, which is what start.sh passed.
      MEMORY: "4G"

      # Aikar's flags, copied verbatim from start.sh rather than generated.
      # USE_AIKAR_FLAGS would very likely produce the same set at this heap
      # size, but "very likely" is not the promise being made here: these are
      # readable straight across against the old command line.
      JVM_XX_OPTS: >-
        -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC
        -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40
        -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15
        -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
      JVM_OPTS: >-
        -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true

      # How long mc-server-runner waits for the server to finish stopping before
      # giving up. Comfortably inside the 180s grace period below, so the server
      # runs out of its own allowance before Docker runs out of patience --
      # which is the order that produces a clean shutdown rather than a kill.
      STOP_DURATION: "120"

      # Run the server as root, which is what it has always done.
      #
      # Not a recommendation -- see below -- but it is the existing behaviour,
      # and restoring the clean shutdown was not the moment to also change which
      # user runs the server.
      #
      # The image has no USER of its own: it starts as root and drops privileges
      # inside the entrypoint that used to be overridden. So overriding it meant
      # the server ran as root, and every file it has written since is root
      # owned -- config/, logs/, the world. Setting uid 1000 here made the
      # server unable to write its own files:
      #
      #   java.nio.file.AccessDeniedException: /data/config/fml.toml
      #   java.io.FileNotFoundException: logs/latest.log (Permission denied)
      #
      # Note that `stat` on the directory itself reports 1000:1000 and tells you
      # nothing -- a human created the mount point, the container filled it. What
      # matters is the contents:
      #
      #   find /home/useradmin/mcserver -maxdepth 2 -printf '%u:%g\n' | sort -u
      #
      # To move off root, which is worth doing on a server that executes mod
      # code: stop the container, `chown -R 1000:1000 /home/useradmin/mcserver`,
      # set both of these to "1000", and start it again. One-time, reversible,
      # and independent of everything else in this file.
      UID: "0"
      GID: "0"
    volumes:
      - /home/useradmin/mcserver:/data
    # stdin stays open because mc-server-runner writes `stop` into it. Without
    # it the graceful shutdown has nowhere to send the command.
    stdin_open: true
    tty: true
    # How long Docker waits after SIGTERM before SIGKILL. The default is ten
    # seconds, which a modpack this size cannot save and exit within. Longer
    # than STOP_DURATION above on purpose: the server should always be the one
    # that decides it has finished. Sets the container's StopTimeout, which
    # `docker stop` uses when no -t is given -- the sidecar passes one anyway,
    # since this only applies once the container has been recreated.
    stop_grace_period: 180s
    restart: unless-stopped

# Shared spool between the API and the mc-control sidecar: the API writes
# command files into /control/queue, the sidecar writes /control/status back.
volumes:
  mc-control:
  # Scratch space for the icon renderer: the extracted vanilla client assets
  # and intermediate renders. Safe to delete; it is rebuilt on the next run.
  item-icons-work:
