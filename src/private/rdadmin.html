<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainDrippy Studios - Admin Dashboard</title>
    <link rel="icon" href="/raindrippy/rd.png">
    <link rel="stylesheet" href="https://bakosmp.go.ro/raindrippy/index.css">
    <link rel="stylesheet" href="https://bakosmp.go.ro/cookie.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background: #eee; }
        button { padding: 5px 10px; margin-right: 5px; }
        
        /* Overlay styles */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        #overlayContent {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        #overlayContent h3 {
            margin-top: 0;
            color: #333;
        }
        
        #overlayContent p {
            margin: 15px 0;
            word-break: break-all;
        }
        
        #overlayContent button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        
        .copyBtn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        .copyBtn:hover {
            background: #0056b3;
        }
        
        .closeBtn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        .closeBtn:hover {
            background: #545b62;
        }

        /* Tabs — same markup contract as dashboard.html (.tab[data-tab] / .tab-content) */
        .tab-container {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid #ccc;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 18px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            user-select: none;
        }

        .tab:hover { background: #f0f0f0; }

        .tab.active {
            background: #fff;
            border-color: #ccc;
            font-weight: bold;
            margin-bottom: -2px;
            border-bottom: 2px solid #fff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Console */
        #consoleToolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        #consoleToolbar label { display: flex; align-items: center; gap: 5px; }

        #connStatus {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #555;
        }

        #connDot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c757d;
        }

        #connDot.live { background: #28a745; }
        #connDot.connecting { background: #ffc107; }
        #connDot.down { background: #dc3545; }

        #consoleOutput {
            background: #12151a;
            color: #d6dbe3;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.45;
            padding: 12px;
            border-radius: 6px;
            height: 60vh;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre;
        }

        #consoleOutput .line { display: block; }
        #consoleOutput .lvl-WARN { color: #f0c674; }
        #consoleOutput .lvl-ERROR, #consoleOutput .lvl-FATAL { color: #ff6b6b; }
        #consoleOutput .lvl-meta { color: #7f8a99; font-style: italic; }
        #consoleOutput .lvl-echo { color: #6fb3ff; font-weight: bold; }

        #consoleForm {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        #consoleInput {
            flex: 1;
            padding: 10px;
            font-family: Consolas, "Courier New", monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #powerControls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #serverState {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            margin-right: 6px;
        }

        .state-running { background: #d4edda; color: #155724; }
        .state-stopped { background: #f8d7da; color: #721c24; }
        .state-unknown { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div id="topbar">
    <img src="rd.png" alt="RainDrippy" class="logo" onclick="window.location.href='index.html'">
    <span class="tpbar-txt" style="margin-left: 20px;">Admin Panel</span>
    <a class="tpbar-txt" href="profile.html" style="margin-left: 2em;">Profile</a>
</div>

<div id="content">
    <div class="tab-container">
        <div class="tab active" data-tab="users">Users</div>
        <div class="tab" data-tab="console">Server Console</div>
    </div>

    <div class="tab-content active" id="users-tab">
    <h1>Manage User Accounts</h1>

    <input type="text" id="searchUser" placeholder="Search username..." />

    <table id="userTable">
        <thead>
            <tr>
                <th>Username</th>
                <th>Status</th>
                <th>Admin</th>
                <th>Member</th>
                <th>RD Projects Access</th>
                <th>Plex Access</th>
                <th>OG</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- user rows dynamically inserted here -->
        </tbody>
    </table>

    <div id="pagination" style="margin-top: 10px; display: flex; justify-content: center;">
        <button id="prevPageBtn" disabled>Previous</button>
        <span id="currentPageSpan" style="margin: 0 10px;">Page 1</span>
        <button id="nextPageBtn">Next</button>
    </div>

    <div id="moderationPanel" style="margin: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>Moderation Panel</h2>

        <div>
            <label for="modUsername">Username:</label><br>
            <input type="text" id="modUsername" placeholder="Enter username...">
        </div>

        <div>
            <label for="banType">Ban Type:</label><br>
            <select id="banType">
            <option value="1d">1 Day</option>
            <option value="3d">3 Days</option>
            <option value="7d">7 Days</option>
            <option value="perm">Permanent</option>
            <option value="poison">Poison</option>
            </select>
        </div>

        <div>
            <label for="modNote">Reason / Moderator Note:</label><br>
            <textarea id="modNote" placeholder="Reason for ban..." rows="3" cols="40"></textarea>
        </div>

        <div id="incriminatorySection">
            <h3>Incriminatory Content</h3>
            <div id="incriminatoryList"></div>
            <button type="button" id="addIncriminatory">+ Add Evidence</button>
        </div>

        <button id="applyBan" style="margin-top: 15px;">Apply Moderation</button>
    </div>
    </div><!-- /users-tab -->

    <div class="tab-content" id="console-tab">
        <h1>Server Console</h1>

        <div id="consoleToolbar">
            <span id="powerControls">
                <span id="serverState" class="state-unknown">Server: unknown</span>
                <button type="button" class="powerBtn" data-action="start">Start</button>
                <button type="button" class="powerBtn" data-action="stop">Stop</button>
                <button type="button" class="powerBtn" data-action="restart">Restart</button>
            </span>
        </div>

        <div id="consoleToolbar">
            <label for="consoleSource">Source:
                <select id="consoleSource">
                    <option value="log">latest.log</option>
                    <option value="stdout">Container stdout</option>
                </select>
            </label>

            <span id="connStatus"><span id="connDot"></span><span id="connText">Disconnected</span></span>

            <label><input type="checkbox" id="autoscroll" checked> Autoscroll</label>

            <button type="button" id="clearConsole">Clear</button>
            <a href="/api/admin/console/download"><button type="button">Download latest.log</button></a>
        </div>

        <div id="consoleOutput" aria-live="polite"></div>

        <form id="consoleForm" autocomplete="off">
            <input type="text" id="consoleInput" placeholder="Type a command (e.g. list) and press Enter…">
            <button type="submit" id="consoleSend">Send</button>
        </form>
    </div><!-- /console-tab -->
</div>

<!-- Overlay for messages -->
<div id="overlay">
    <div id="overlayContent">
        <h3 id="overlayTitle">Message</h3>
        <p id="overlayMessage"></p>
        <div id="overlayButtons"></div>
    </div>
</div>

<script>
    const userTableBody = document.querySelector('#userTable tbody');
    const searchUser = document.getElementById('searchUser');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMessage = document.getElementById('overlayMessage');
    const overlayButtons = document.getElementById('overlayButtons');
    let evidenceFields = [];
    let currentPage = 1;

    // Overlay functions
    function showOverlay(title, message, buttons = []) {
        overlayTitle.textContent = title;
        overlayMessage.innerHTML = message;
        overlayButtons.innerHTML = '';
        
        if (buttons.length === 0) {
            buttons.push({
                text: 'Close',
                class: 'closeBtn',
                onClick: hideOverlay
            });
        }
        
        buttons.forEach(btn => {
            const button = document.createElement('button');
            button.textContent = btn.text;
            button.className = btn.class || 'closeBtn';
            button.onclick = btn.onClick;
            overlayButtons.appendChild(button);
        });
        
        overlay.style.display = 'flex';
    }

    function hideOverlay() {
        overlay.style.display = 'none';
    }

    // Add evidence field functionality
    document.getElementById('addIncriminatory').addEventListener('click', function() {
        const incriminatoryList = document.getElementById('incriminatoryList');
        const evidenceDiv = document.createElement('div');
        evidenceDiv.innerHTML = `
            <div style="margin: 10px 0; padding: 10px; border: 1px solid #ddd;">
                <input type="text" placeholder="Reason (e.g. Spam, Harassment, etc.)" style="width: 100%; margin: 5px 0;">
                <textarea placeholder="Content/Evidence (URLs, screenshots, descriptions, etc.)" style="width: 100%; margin: 5px 0; height: 60px;"></textarea>
                <button type="button" onclick="this.parentNode.remove()">Remove Evidence</button>
            </div>
        `;
        incriminatoryList.appendChild(evidenceDiv);
    });

    // Apply moderation functionality
    document.getElementById('applyBan').addEventListener('click', async function() {
        const username = document.getElementById('modUsername').value.trim();
        const type = document.getElementById('banType').value;
        const modNote = document.getElementById('modNote').value.trim();
        
        // Collect evidence
        const evidenceDivs = document.querySelectorAll('#incriminatoryList > div');
        const incriminatory = [];
        evidenceDivs.forEach(div => {
            const reasonInput = div.querySelector('input');
            const contentTextarea = div.querySelector('textarea');
            if (reasonInput && contentTextarea && reasonInput.value.trim() && contentTextarea.value.trim()) {
                incriminatory.push({
                    reason: reasonInput.value.trim(),
                    content: contentTextarea.value.trim()
                });
            }
        });

        if (!username) {
            showOverlay('Error', 'Please enter a username');
            return;
        }

        try {
            const response = await fetch('/api/admin/moderate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    username,
                    type,
                    modNote,
                    incriminatory: incriminatory.length > 0 ? incriminatory : null,
                    poisonHWID: null,
                    makeAdmin: false
                })
            });

            const data = await response.json();
            
            if (response.ok) {
                showOverlay('Success', 'Moderation applied: ' + data.message);
                // Clear form
                document.getElementById('modUsername').value = '';
                document.getElementById('modNote').value = '';
                document.getElementById('incriminatoryList').innerHTML = '';
                // Refresh users
                fetchUsers(searchUser.value);
            } else {
                showOverlay('Error', data.error || data.message);
            }
        } catch (err) {
            console.error('Error:', err);
            showOverlay('Error', 'Server error occurred');
        }
    });

    async function fetchUsers(query = '', page = currentPage) {
        try {
            const response = await fetch('/api/admin/list-users?search=' + encodeURIComponent(query) + '&page=' + page, { credentials: 'include' });
            const users = await response.json();

            userTableBody.innerHTML = '';
            users.forEach(user => {
                console.log(user); // Add this line for debug
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.accountStatus || 'ok'}</td>
                    <td>
                        <input type="checkbox" class="adminToggle" data-username="${user.username}" ${user.isAdmin ? 'checked' : ''}>
                    </td>
                    <td>
                        <input type="checkbox" class="memberToggle" data-username="${user.username}" ${user.isMember ? 'checked' : ''}>
                    </td>
                    <td>
                        <input type="checkbox" class="projToggle" data-username="${user.username}" ${user.isProjAllowed ? 'checked' : ''}> 
                    </td>
                    <td>
                        <input type="checkbox" class="plexToggle" data-username="${user.username}" ${user.isPlexAllowed ? 'checked' : ''}>
                    </td>
                    <td>
                        <input type="checkbox" class="ogToggle" data-username="${user.username}" ${user.isOG ? 'checked' : ''}>
                    </td>
                    <td>
                        <button class="unbanBtn" data-username="${user.username}">Unban / Clear Moderation</button>
                        <button class="deleteBtn" data-username="${user.username}">Delete Account</button>
                        <button class="genPWDreset" data-username="${user.username}">Generate Password Reset</button>
                    </td>
                `;
                userTableBody.appendChild(tr);
            });

            document.getElementById('currentPageSpan').textContent = `Page ${page}`;
            document.getElementById('prevPageBtn').disabled = page === 1;
            document.getElementById('nextPageBtn').disabled = users.length < 10;

            attachEvents();
        } catch (err) {
            console.error('Error fetching users:', err);
        }
    }

    function attachEvents() {
        document.querySelectorAll('.unbanBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const username = btn.dataset.username;
                try {
                    const response = await fetch('/api/admin/unban', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username })
                    });
                    const data = await response.json();
                    showOverlay('Success', data.message || 'User unbanned successfully');
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                    showOverlay('Error', 'Server error occurred');
                }
            });
        });

        document.querySelectorAll('.deleteBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const username = btn.dataset.username;
                if (!confirm(`Are you sure you want to delete the account "${username}"? This action cannot be undone.`)) {
                    return;
                }
                try {
                    const response = await fetch('/api/admin/delete-user', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username })
                    });
                    const data = await response.json();
                    showOverlay('Success', data.message || 'User deleted successfully');
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                    showOverlay('Error', 'Server error occurred');
                }
            });
        });

        document.querySelectorAll('.genPWDreset').forEach(btn => {
            btn.addEventListener('click', async () => {
                const username = btn.dataset.username;
                try {
                    const response = await fetch('/api/admin/gen-pwd-reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username })
                    });
                    const data = await response.json();
                    
                    if (response.ok && data.resetSession) {
                        const resetLink = `https://bakosmp.go.ro/reset-pwd?session=${data.resetSession}`;
                        const expiresAt = data.expiresAt ? new Date(data.expiresAt).toLocaleString() : 'N/A';
                        
                        showOverlay(
                            'Password Reset Link Generated',
                            `<strong>Message:</strong> ${data.message}<br><br>
                             <strong>Reset Link:</strong><br>
                             <input type="text" id="resetLinkInput" value="${resetLink}" readonly style="width: 100%; padding: 8px; margin: 10px 0; font-size: 12px;">
                             <br><strong>Expires At:</strong> ${expiresAt}`,
                            [
                                {
                                    text: 'Copy Link',
                                    class: 'copyBtn',
                                    onClick: () => {
                                        const input = document.getElementById('resetLinkInput');
                                        input.select();
                                        document.execCommand('copy');
                                        showOverlay('Success', 'Link copied to clipboard!');
                                    }
                                },
                                {
                                    text: 'Close',
                                    class: 'closeBtn',
                                    onClick: hideOverlay
                                }
                            ]
                        );
                    } else {
                        showOverlay('Error', data.error || data.message || 'Failed to generate reset link');
                    }
                } catch (err) {
                    console.error(err);
                    showOverlay('Error', 'Server error occurred');
                }
            });
        });

        document.querySelectorAll('.adminToggle').forEach(chk => {
            chk.addEventListener('change', async () => {
                const username = chk.dataset.username;
                const isAdmin = chk.checked;
                try {
                    const response = await fetch('/api/update-admin-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username, isAdmin })
                    });
                    const data = await response.json();
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                }
            });
        });

        document.querySelectorAll('.memberToggle').forEach(chk => {
            chk.addEventListener('change', async () => {
                const username = chk.dataset.username;
                const isMember = chk.checked;
                try {
                    const response = await fetch('/api/admin/update-member-status', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username, isMember })
                    });
                    const data = await response.json();
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                }
            });
        });
        document.querySelectorAll('.projToggle').forEach(chk => {
            chk.addEventListener('change', async () => {
                const username = chk.dataset.username;
                const isAllowed = chk.checked;
                try {
                    const response = await fetch('/api/admin/update-proj-status', {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ username, isAllowed })
                    });
                    const data = await response.json();
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                }
            });
        });
        document.querySelectorAll('.plexToggle').forEach(chk => {
            chk.addEventListener('change', async () => {
                const username = chk.dataset.username;
                const isAllowed = chk.checked;
                try {
                    const response = await fetch('/api/admin/update-plex-status', {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ username, isAllowed })
                    });
                    const data = await response.json();
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                }
            });
        });

        document.querySelectorAll('.ogToggle').forEach(chk => {
            chk.addEventListener('change', async () => {
                const username = chk.dataset.username;
                const isOG = chk.checked;
                try {
                    const response = await fetch('/api/admin/update-og-status', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username, isOG })
                    });
                    const data = await response.json();
                    fetchUsers(searchUser.value);
                } catch (err) {
                    console.error(err);
                }
            });
        });
    }
    let SearchTimer;
    searchUser.addEventListener('input', () => {
        clearTimeout(SearchTimer);
        SearchTimer = setTimeout(() => {
            currentPage = 1;
            fetchUsers(searchUser.value, currentPage);
        }, 500);
    });

    document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            fetchUsers(searchUser.value, currentPage);
        }
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++;
        fetchUsers(searchUser.value, currentPage);
    });

    // Close overlay when clicking outside
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            hideOverlay();
        }
    });

    // initial fetch
    fetchUsers();

    /* ---------------------------------------------------------------- Tabs */

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            tab.classList.add('active');
            document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');

            // The console holds an open connection, so it is only attached
            // while its tab is actually visible.
            if (tab.dataset.tab === 'console') {
                consoleConnect();
                startStatusPolling();
            } else {
                consoleDisconnect();
                stopStatusPolling();
            }
        });
    });

    /* ------------------------------------------------------------- Console */

    const MAX_CONSOLE_LINES = 2000;   // past this the page starts to crawl
    const consoleOutput = document.getElementById('consoleOutput');
    const consoleSource = document.getElementById('consoleSource');
    const consoleInput = document.getElementById('consoleInput');
    const autoscroll = document.getElementById('autoscroll');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    let evtSource = null;
    let retryDelay = 1000;
    let retryTimer = null;
    let stuckToBottom = true;
    const history = [];
    let historyIndex = 0;

    function setStatus(state, text) {
        connDot.className = state;
        connText.textContent = text;
    }

    // Minecraft lines look like "[12:34:56] [Server thread/INFO]: message".
    function levelOf(line) {
        const match = line.match(/\[[^\]]*\/(\w+)\]/);
        return match ? match[1].toUpperCase() : '';
    }

    function appendLine(text, forcedClass) {
        const line = document.createElement('span');
        line.className = 'line ' + (forcedClass || 'lvl-' + levelOf(text));
        // textContent, never innerHTML: log lines carry player chat, which is
        // attacker-controlled and would otherwise inject markup into the panel.
        line.textContent = text;
        consoleOutput.appendChild(line);

        while (consoleOutput.childElementCount > MAX_CONSOLE_LINES) {
            consoleOutput.removeChild(consoleOutput.firstChild);
        }

        if (autoscroll.checked && stuckToBottom) {
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
    }

    // Autoscroll pauses on its own when the operator scrolls up to read, and
    // resumes once they return to the bottom.
    consoleOutput.addEventListener('scroll', () => {
        const distance = consoleOutput.scrollHeight - consoleOutput.scrollTop - consoleOutput.clientHeight;
        stuckToBottom = distance < 40;
    });

    function consoleDisconnect() {
        clearTimeout(retryTimer);
        if (evtSource) {
            evtSource.close();
            evtSource = null;
        }
        setStatus('', 'Disconnected');
    }

    function consoleConnect() {
        consoleDisconnect();
        setStatus('connecting', 'Connecting…');

        const source = new EventSource('/api/admin/console/stream?source=' + encodeURIComponent(consoleSource.value));
        evtSource = source;

        source.onopen = () => {
            retryDelay = 1000;
            setStatus('live', 'Live');
        };

        source.onmessage = (e) => appendLine(e.data);

        source.onerror = () => {
            // A non-200 (e.g. an expired session returning 401) closes the
            // EventSource permanently, and the browser's own retry does not
            // back off — so reconnection is handled here instead.
            source.close();
            if (evtSource !== source) return;   // superseded by a newer connect
            evtSource = null;

            setStatus('down', `Reconnecting in ${Math.round(retryDelay / 1000)}s…`);
            retryTimer = setTimeout(() => {
                if (document.getElementById('console-tab').classList.contains('active')) {
                    consoleConnect();
                }
            }, retryDelay);
            retryDelay = Math.min(retryDelay * 2, 30000);
        };
    }

    consoleSource.addEventListener('change', () => {
        appendLine(`── switched to ${consoleSource.options[consoleSource.selectedIndex].text} ──`, 'lvl-meta');
        consoleConnect();
    });

    document.getElementById('clearConsole').addEventListener('click', () => {
        consoleOutput.innerHTML = '';
    });

    document.getElementById('consoleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const command = consoleInput.value.trim();
        if (!command) return;

        history.push(command);
        historyIndex = history.length;
        consoleInput.value = '';
        appendLine('> ' + command, 'lvl-echo');

        try {
            const response = await fetch('/api/admin/console/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ command })
            });
            const data = await response.json();

            if (!response.ok) {
                appendLine(data.error || 'Command failed', 'lvl-ERROR');
                return;
            }
            if (data.output) {
                data.output.split('\n').forEach(line => appendLine(line, 'lvl-meta'));
            }
        } catch (err) {
            console.error(err);
            appendLine('Failed to reach the server', 'lvl-ERROR');
        }
    });

    consoleInput.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        if (!history.length) return;
        e.preventDefault();

        if (e.key === 'ArrowUp') {
            historyIndex = Math.max(0, historyIndex - 1);
        } else {
            historyIndex = Math.min(history.length, historyIndex + 1);
        }
        consoleInput.value = historyIndex === history.length ? '' : history[historyIndex];
    });

    /* ------------------------------------------------------- Power control */

    const serverState = document.getElementById('serverState');
    let statusTimer = null;

    async function refreshStatus() {
        try {
            const response = await fetch('/api/admin/console/power/status', { credentials: 'include' });
            if (!response.ok) throw new Error('status ' + response.status);
            const data = await response.json();
            serverState.textContent = 'Server: ' + data.state;
            serverState.className = 'state-' + data.state;
        } catch (err) {
            // "unknown" means the sidecar isn't reporting — deliberately not
            // shown as "stopped", which would be misleading.
            serverState.textContent = 'Server: unknown';
            serverState.className = 'state-unknown';
        }
    }

    function startStatusPolling() {
        refreshStatus();
        clearInterval(statusTimer);
        statusTimer = setInterval(refreshStatus, 5000);
    }

    function stopStatusPolling() {
        clearInterval(statusTimer);
        statusTimer = null;
    }

    document.querySelectorAll('.powerBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const action = btn.dataset.action;
            if (action !== 'start' && !confirm(`Really ${action} the Minecraft server?`)) return;

            document.querySelectorAll('.powerBtn').forEach(b => b.disabled = true);
            try {
                const response = await fetch('/api/admin/console/power/' + action, {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await response.json();

                if (response.ok) {
                    // The sidecar polls its spool directory, so this is queued
                    // rather than done — the status pill reflects the result.
                    appendLine(`── ${action} queued ──`, 'lvl-meta');
                } else {
                    appendLine(data.error || `Failed to ${action}`, 'lvl-ERROR');
                }
            } catch (err) {
                console.error(err);
                appendLine(`Failed to reach the server to ${action}`, 'lvl-ERROR');
            } finally {
                document.querySelectorAll('.powerBtn').forEach(b => b.disabled = false);
                setTimeout(refreshStatus, 1500);
            }
        });
    });

    // Drop the connection when the tab is closed rather than leaving the
    // server streaming into nothing.
    window.addEventListener('beforeunload', () => {
        consoleDisconnect();
        stopStatusPolling();
    });
</script>
