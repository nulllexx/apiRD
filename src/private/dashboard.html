<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainDrippy - Status Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://bakosmp.go.ro/status/dashboard.css">
    <link rel="icon" type="image/png" href="https://bakosmp.go.ro/raindrippy/rd.png">
    <link rel="stylesheet" href="https://bakosmp.go.ro/cookie.css">
</head>
<body>
    <div id="topbar">
        <div class="logo-container">
            <img src="https://bakosmp.go.ro/raindrippy/rd.png" alt="RainDrippy Logo" class="logo" onclick="window.location.href='/raindrippy/index.html'">
        </div>
        <a href="/status" class="nav-link">Public Status</a>
    </div>

    <div class="container">
        <div class="dashboard-header">
            <h1 class="dashboard-title">Admin Dashboard</h1>
            <div id="current-time"></div>
        </div>

        <div id="alert-box"></div>

        <div class="card">
            <h2 class="card-title">Create New Incident</h2>
            <form id="create-incident-form">
                <div class="form-group">
                    <label for="incident-title">Incident Title</label>
                    <input type="text" id="incident-title" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="incident-impact">Impact Level</label>
                    <select id="incident-impact" class="form-control" required>
                        <option value="minimal_outage">Minimal Outage</option>
                        <option value="partial_outage" selected>Partial Outage</option>
                        <option value="full_outage">Full Outage</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="incident-status">Initial Status</label>
                    <select id="incident-status" class="form-control" required>
                        <option value="investigating" selected>Investigating</option>
                        <option value="identified">Identified</option>
                        <option value="monitoring">Monitoring</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="incident-context">Status Context</label>
                    <textarea id="incident-context" class="form-control" placeholder="Describe what you know about the issue"></textarea>
                </div>
                
                <div class="form-group" style="display: none;">
                    <label for="incident-update">Initial Update (Optional)</label>
                    <textarea id="incident-update" class="form-control" placeholder="Provide more details about the incident"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Component Status Updates (Optional)</label>
                    <div class="component-updates" id="create-component-updates">
                        <div class="component-update">
                            <select class="form-control component-select">
                                <option value="">Select a component</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                            <select class="form-control status-select">
                                <option value="operational">Operational</option>
                                <option value="degraded">Degraded</option>
                                <option value="disruption">Disruption</option>
                            </select>
                            <button type="button" class="remove-component btn-danger"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <button type="button" id="add-component-update" class="btn btn-outline"><i class="fas fa-plus"></i> Add Component Update</button>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Incident</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">System Components</h2>
            <div class="component-grid" id="components-container">
                <!-- Components will be loaded here -->
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Incident Management</h2>
            
            <div class="tab-container">
                <div class="tab active" data-tab="active">Active Incidents</div>
                <div class="tab" data-tab="resolved">Resolved Incidents</div>
                <div class="tab" data-tab="all">All Incidents</div>
            </div>
            
            <div class="tab-content active" id="active-incidents">
                <ul class="incident-list" id="active-incidents-list">
                    <!-- Active incidents will be loaded here -->
                </ul>
            </div>
            
            <div class="tab-content" id="resolved-incidents">
                <ul class="incident-list" id="resolved-incidents-list">
                    <!-- Resolved incidents will be loaded here -->
                </ul>
            </div>
            
            <div class="tab-content" id="all-incidents">
                <ul class="incident-list" id="all-incidents-list">
                    <!-- All incidents will be loaded here -->
                </ul>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = '/api/status';

        // DOM elements
        const alertBox = document.getElementById('alert-box');
        const currentTimeEl = document.getElementById('current-time');
        const componentsContainer = document.getElementById('components-container');
        const createIncidentForm = document.getElementById('create-incident-form');
        const createComponentUpdates = document.getElementById('create-component-updates');
        const addComponentButton = document.getElementById('add-component-update');

        // Component data cache
        let componentsData = [];

        // Tab functionality
        document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
        // Remove active class from all tabs and contents
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        // Add active class to clicked tab and corresponding content
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-incidents`).classList.add('active');

        // Load data for the selected tab
        if (tab.dataset.tab === 'active') {
        loadActiveIncidents();
        } else if (tab.dataset.tab === 'resolved') {
        loadResolvedIncidents();
        } else if (tab.dataset.tab === 'all') {
        loadAllIncidents();
        }
        });
        });

        // Show alert message
        function showAlert(message, type = 'success') {
        alertBox.innerHTML = `
        <div class="alert alert-${type}">
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        ${message}
        </div>
        `;
        alertBox.style.display = 'block';

        // Hide alert after 5 seconds
        setTimeout(() => {
        alertBox.style.display = 'none';
        }, 5000);
        }

        // Format date to PDT
        function formatTimeToPDT(isoString) {
        const date = new Date(isoString);
        // Convert to PDT (UTC-7)
        const pdtTime = new Date(date.getTime() - (7 * 60 * 60 * 1000));
        const hours = pdtTime.getUTCHours();
        const minutes = pdtTime.getUTCMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 || 12;
        return `${formattedHours}:${minutes.toString().padStart(2, '0')} ${ampm} (PDT)`;
        }

        // Load components
        async function loadComponents() {
        try {
        const response = await fetch(`${API_BASE}/status`);
        const data = await response.json();

        componentsData = data.components;
        componentsContainer.innerHTML = '';

        // Populate component dropdowns
        const componentSelects = document.querySelectorAll('.component-select');
        componentSelects.forEach(select => {
        // Save current selection
        const currentValue = select.value;

        // Clear options
        select.innerHTML = '<option value="">Select a component</option>';

        // Add components
        componentsData.forEach(component => {
            const option = document.createElement('option');
            option.value = component.id;
            option.textContent = component.name;
            select.appendChild(option);
        });

        // Restore selection if still valid
        if (currentValue && componentsData.some(c => c.id === currentValue)) {
            select.value = currentValue;
        }
        });

        // Display components
        componentsData.forEach(component => {
        const statusClass = 
            component.status === 'operational' ? 'status-operational' :
            component.status === 'degraded' ? 'status-degraded' : 'status-disruption';

        const componentEl = document.createElement('div');
        componentEl.className = 'component-card';
        componentEl.innerHTML = `
            <h3 class="component-name">${component.name}</h3>
            <div class="component-status ${statusClass}">${component.status}</div>
            <p class="last-updated">Last updated: ${formatTimeToPDT(component.last_updated)}</p>
            <div class="form-group">
                <select class="form-control component-status-select" data-component-id="${component.id}">
                    <option value="operational" ${component.status === 'operational' ? 'selected' : ''}>Operational</option>
                    <option value="degraded" ${component.status === 'degraded' ? 'selected' : ''}>Degraded</option>
                    <option value="disruption" ${component.status === 'disruption' ? 'selected' : ''}>Disruption</option>
                </select>
            </div>
            <button class="btn btn-primary update-component-btn" data-component-id="${component.id}">Update Status</button>
        `;

        componentsContainer.appendChild(componentEl);
        });

        // Add event listeners to update buttons
        document.querySelectorAll('.update-component-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            const componentId = e.target.dataset.componentId;
            const statusSelect = document.querySelector(`.component-status-select[data-component-id="${componentId}"]`);
            const status = statusSelect.value;
            
            try {
                const response = await fetch(`${API_BASE}/components/${componentId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });
                
                if (response.ok) {
                    showAlert('Component status updated successfully');
                    loadComponents(); // Reload components
                } else {
                    showAlert('Failed to update component status', 'error');
                }
            } catch (error) {
                showAlert('Error updating component status', 'error');
                console.error('Error:', error);
            }
        });
        });
        } catch (error) {
        console.error('Error loading components:', error);
        showAlert('Error loading components', 'error');
        }
        }

        // Add component update field
        function addComponentUpdateField(container) {
        const updateField = document.createElement('div');
        updateField.className = 'component-update';
        updateField.innerHTML = `
        <select class="form-control component-select">
        <option value="">Select a component</option>
        ${componentsData.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <select class="form-control status-select">
        <option value="operational">Operational</option>
        <option value="degraded">Degraded</option>
        <option value="disruption">Disruption</option>
        </select>
        <button type="button" class="remove-component btn-danger"><i class="fas fa-times"></i></button>
        `;

        container.appendChild(updateField);

        // Add event listener to remove button
        updateField.querySelector('.remove-component').addEventListener('click', () => {
        updateField.remove();
        });
        }

        // Load active incidents
        async function loadActiveIncidents() {
        try {
        const response = await fetch(`${API_BASE}/status`);
        const data = await response.json();

        const incidentsList = document.getElementById('active-incidents-list');
        incidentsList.innerHTML = '';

        if (data.incidents.length === 0) {
        incidentsList.innerHTML = '<p>No active incidents</p>';
        return;
        }

        data.incidents.forEach(incident => {
        const incidentEl = document.createElement('li');
        incidentEl.className = 'incident-item';
        incidentEl.innerHTML = renderIncident(incident);
        incidentsList.appendChild(incidentEl);

        // Add event listener to update form
        const updateForm = incidentEl.querySelector('.add-update-form');
        if (updateForm) {
            updateForm.addEventListener('submit', handleUpdateSubmit);
        }
        });
        } catch (error) {
        console.error('Error loading active incidents:', error);
        showAlert('Error loading active incidents', 'error');
        }
        }

        // Load resolved incidents
        async function loadResolvedIncidents() {
        try {
        const response = await fetch(`${API_BASE}/incidentHistory`);
        const incidents = await response.json();

        const incidentsList = document.getElementById('resolved-incidents-list');
        incidentsList.innerHTML = '';

        if (incidents.length === 0) {
        incidentsList.innerHTML = '<p>No resolved incidents</p>';
        return;
        }

        incidents.forEach(incident => {
        const incidentEl = document.createElement('li');
        incidentEl.className = 'incident-item';
        incidentEl.innerHTML = renderIncident(incident);
        incidentsList.appendChild(incidentEl);
        });
        } catch (error) {
        console.error('Error loading resolved incidents:', error);
        showAlert('Error loading resolved incidents', 'error');
        }
        }

        // Load all incidents
        async function loadAllIncidents() {
        try {
        const response = await fetch(`${API_BASE}/incidents`);
        const incidents = await response.json();

        const incidentsList = document.getElementById('all-incidents-list');
        incidentsList.innerHTML = '';

        if (incidents.length === 0) {
        incidentsList.innerHTML = '<p>No incidents</p>';
        return;
        }

        incidents.forEach(incident => {
        const incidentEl = document.createElement('li');
        incidentEl.className = 'incident-item';
        incidentEl.innerHTML = renderIncident(incident);
        incidentsList.appendChild(incidentEl);

        // Add event listener to update form if incident is not resolved
        if (incident.status !== 'resolved') {
            const updateForm = incidentEl.querySelector('.add-update-form');
            if (updateForm) {
                updateForm.addEventListener('submit', handleUpdateSubmit);
            }
        }
        });
        } catch (error) {
        console.error('Error loading all incidents:', error);
        showAlert('Error loading all incidents', 'error');
        }
        }

        // Render incident HTML
        function renderIncident(incident) {
        const statusClass = 
        incident.status === 'investigating' ? 'status-investigating' :
        incident.status === 'identified' ? 'status-identified' :
        incident.status === 'monitoring' ? 'status-monitoring' : 'status-resolved';

        let historyHTML = '';
        if (incident.history_status && incident.history_status.length > 0) {
        historyHTML = '<div class="history-list">';
        incident.history_status.forEach(history => {
        historyHTML += `
            <div class="history-item">
                <div class="history-time">${history.time} - ${history.status}</div>
                <div class="history-context">${history.context}</div>
            </div>
        `;
        });
        historyHTML += '</div>';
        }

        return `
        <div class="incident-title">${incident.title}</div>
        <div class="incident-meta">
        <span class="incident-status ${statusClass}">${incident.status}</span>
        <span class="impact-badge">${incident.impact}</span>
        <span>Started: ${formatTimeToPDT(incident.started_at)}</span>
        ${incident.ended_at ? `<span>Ended: ${formatTimeToPDT(incident.ended_at)}</span>` : ''}
        </div>
        <div class="incident-context">${incident.status_text}</div>
        ${historyHTML}
        ${incident.status !== 'resolved' ? `
        <div class="update-form">
            <h4>Add Update</h4>
            <form class="add-update-form" data-incident-id="${incident.id}">
                <div class="form-group">
                    <textarea class="form-control update-body" placeholder="Provide an update" required></textarea>
                </div>
                <div class="form-group">
                    <label>Update Status (Optional)</label>
                    <select class="form-control update-status">
                        <option value="">Keep current status</option>
                        <option value="investigating">Investigating</option>
                        <option value="identified">Identified</option>
                        <option value="monitoring">Monitoring</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Component Status Updates (Optional)</label>
                    <div class="component-updates" id="update-component-updates-${incident.id}">
                        <div class="component-update">
                            <select class="form-control component-select">
                                <option value="">Select a component</option>
                                ${componentsData.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                            </select>
                            <select class="form-control status-select">
                                <option value="operational">Operational</option>
                                <option value="degraded">Degraded</option>
                                <option value="disruption">Disruption</option>
                            </select>
                            <button type="button" class="remove-component btn-danger"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline add-update-component" data-target="update-component-updates-${incident.id}">
                        <i class="fas fa-plus"></i> Add Component Update
                    </button>
                </div>
                <button type="submit" class="btn btn-primary">Add Update</button>
            </form>
        </div>
        ` : ''}
        `;
        }

        // Handle update form submission
        async function handleUpdateSubmit(e) {
        e.preventDefault();

        const incidentId = e.target.dataset.incidentId;
        const body = e.target.querySelector('.update-body').value;
        const status = e.target.querySelector('.update-status').value;

        // Get component updates
        const componentUpdates = [];
        const updateElements = e.target.querySelectorAll('.component-update');

        updateElements.forEach(element => {
        const componentId = element.querySelector('.component-select').value;
        const status = element.querySelector('.status-select').value;

        if (componentId && status) {
        const component = componentsData.find(c => c.id === componentId);
        componentUpdates.push({
            componentId,
            status,
            name: component ? component.name : componentId
        });
        }
        });

        try {
        const requestBody = {
        body,
        status: status || undefined,
        status_text: body // Using body as status_text for simplicity
        };

        // Add componentUpdates if any
        if (componentUpdates.length > 0) {
        requestBody.componentUpdates = componentUpdates;
        }

        const response = await fetch(`${API_BASE}/incidents/${incidentId}/updates`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
        });

        if (response.ok) {
        showAlert('Update added successfully');
        e.target.reset();

        // Reload incidents and components
        loadActiveIncidents();
        loadComponents();
        } else {
        const error = await response.json();
        showAlert(error.error || 'Failed to add update', 'error');
        }
        } catch (error) {
        showAlert('Error adding update', 'error');
        console.error('Error:', error);
        }
        }

        // Create new incident
        createIncidentForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('incident-title').value;
        const impact = document.getElementById('incident-impact').value;
        const status = document.getElementById('incident-status').value;
        const status_text = document.getElementById('incident-context').value;
        const update = document.getElementById('incident-update').value;

        // Get component updates
        const componentUpdates = [];
        const updateElements = createComponentUpdates.querySelectorAll('.component-update');

        updateElements.forEach(element => {
        const componentId = element.querySelector('.component-select').value;
        const status = element.querySelector('.status-select').value;

        if (componentId && status) {
        const component = componentsData.find(c => c.id === componentId);
        componentUpdates.push({
            componentId,
            status,
            name: component ? component.name : componentId
        });
        }
        });

        try {
        const requestBody = {
        title,
        impact,
        status,
        status_text,
        update: update || undefined
        };

        // Add componentUpdates if any
        if (componentUpdates.length > 0) {
        requestBody.componentUpdates = componentUpdates;
        }

        const response = await fetch(`${API_BASE}/incidents`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
        });

        if (response.ok) {
        showAlert('Incident created successfully');
        createIncidentForm.reset();

        // Clear component updates except the first one
        const updateElements = createComponentUpdates.querySelectorAll('.component-update');
        for (let i = 1; i < updateElements.length; i++) {
            updateElements[i].remove();
        }
        // Reset the first one
        const firstUpdate = createComponentUpdates.querySelector('.component-update');
        firstUpdate.querySelector('.component-select').value = '';
        firstUpdate.querySelector('.status-select').value = 'operational';

        // Reload incidents and components
        loadActiveIncidents();
        loadComponents();
        } else {
        const error = await response.json();
        showAlert(error.error || 'Failed to create incident', 'error');
        }
        } catch (error) {
        showAlert('Error creating incident', 'error');
        console.error('Error:', error);
        }
        });

        // Add component update field when button is clicked
        addComponentButton.addEventListener('click', () => {
        addComponentUpdateField(createComponentUpdates);
        });

        // Delegate event for dynamically added "Add Component Update" buttons in incident updates
        document.addEventListener('click', (e) => {
        if (e.target.classList.contains('add-update-component')) {
        const targetId = e.target.dataset.target;
        const container = document.getElementById(targetId);
        addComponentUpdateField(container);
        }

        // Delegate event for remove buttons in component updates
        if (e.target.classList.contains('remove-component')) {
        e.target.closest('.component-update').remove();
        }
        });

        // Update current time
        function updateCurrentTime() {
        const now = new Date();
        currentTimeEl.textContent = now.toLocaleString();
        }

        // Initialize dashboard
        async function initDashboard() {
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);

        await loadComponents();
        await loadActiveIncidents();
        }

        // Start the dashboard
        initDashboard();
    </script>
</body>
</html>
