[package]
name = "api-rd"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "cookies"] }
notify = "7"
sha2 = "0.10"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
dashmap = "6"
fs2 = "0.4"
futures-util = "0.3"
sanitize-filename = "0.6"
mime_guess = "2"
urlencoding = "2"
oauth2 = "4.4"
fastnbt = "2"
flate2 = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
