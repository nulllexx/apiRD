name: Build and Deploy apiRD

on:
  push:
    branches:
      - main  # or master, adjust as needed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          source: "docker-compose.yml"
          target: "/home/useradmin/docker/"

      - name: Deploy to Linux machine via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          script: |
            cd /home/useradmin/docker/
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            DB_HOST="${{ secrets.DB_HOST }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"

            # Fail fast if any required DB secret is missing/empty. The compose
            # `environment:` block interpolates these values at every `up`, so a
            # blank value would recreate the API container with DB_HOST="" and
            # crash it with Configuration(EmptyHost).
            missing=""
            for v in DB_HOST DB_USER DB_PASSWORD DB_NAME; do
              eval "val=\$$v"
              if [ -z "$val" ]; then missing="$missing $v"; fi
            done
            if [ -n "$missing" ]; then
              echo "::error::Refusing to deploy — empty GitHub secret(s):$missing"
              echo "Set them as *repository* secrets (Settings > Secrets and variables > Actions)."
              docker logout ghcr.io
              exit 1
            fi

            # Persist the interpolation values to a .env in the compose project
            # directory. Docker Compose auto-reads this file for ${...} variables,
            # so ANY `docker-compose up` here (CI, cron, or a human on the box)
            # resolves them durably — not just during this SSH session.
            umask 077
            cat > /home/useradmin/docker/.env <<EOF
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            DB_HOST=$DB_HOST
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_NAME=$DB_NAME
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            EOF

            docker-compose pull api
            docker-compose up -d api

            # Verify the container actually came up with a non-empty DB_HOST.
            actual_host="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' api | grep '^DB_HOST=' | cut -d= -f2-)"
            if [ -z "$actual_host" ]; then
              echo "::error::api container started with an empty DB_HOST — check the compose .env interpolation."
              docker logout ghcr.io
              exit 1
            fi

            docker logout ghcr.io
